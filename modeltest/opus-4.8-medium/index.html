<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060f" />
    <title>Helios — Interactive 3D Solar System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Interactive 3D model of the solar system"></canvas>

      <!-- Loading overlay -->
      <div id="loader" class="loader">
        <div class="loader-core"></div>
        <p class="loader-text">Igniting the Sun…</p>
      </div>

      <!-- Top bar -->
      <header class="topbar">
        <button id="brand" class="brand" type="button" title="Reset view">
          <span class="brand-star"></span>
          <span class="brand-name">HELIOS</span>
        </button>
        <div class="topbar-status">
          <span class="pulse"></span>
          <span>LIVE SIMULATION</span>
          <span class="sep">·</span>
          <span id="simDay">DAY 0</span>
        </div>
      </header>

      <!-- Info panel -->
      <aside id="infoPanel" class="info-panel" aria-hidden="true">
        <button id="infoClose" class="info-close" type="button" aria-label="Close info panel">×</button>
        <div class="info-swatch"><span id="infoSwatch"></span></div>
        <p class="info-kicker" id="infoType">Planet</p>
        <h2 class="info-name" id="infoName">—</h2>
        <p class="info-desc" id="infoDesc"></p>
        <dl class="info-stats" id="infoStats"></dl>
        <button id="followBtn" class="follow-btn" type="button">Follow orbit</button>
      </aside>

      <!-- Controls -->
      <footer class="controls">
        <div class="control-group">
          <button id="playPause" class="ctrl-btn" type="button" title="Play / Pause">
            <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </button>
        </div>

        <div class="control-group speed-group">
          <span class="ctrl-label">SPEED</span>
          <button class="speed-btn" data-speed="0.25" type="button">0.25×</button>
          <button class="speed-btn" data-speed="0.5" type="button">0.5×</button>
          <button class="speed-btn is-active" data-speed="1" type="button">1×</button>
          <button class="speed-btn" data-speed="3" type="button">3×</button>
          <button class="speed-btn" data-speed="8" type="button">8×</button>
        </div>

        <div class="control-group toggle-group">
          <button id="toggleOrbits" class="ctrl-btn text is-active" type="button">ORBITS</button>
          <button id="toggleLabels" class="ctrl-btn text is-active" type="button">LABELS</button>
          <button id="resetView" class="ctrl-btn text" type="button">RESET</button>
        </div>
      </footer>

      <!-- Floating labels -->
      <div id="labelLayer" class="label-layer" aria-hidden="true"></div>

      <p class="hint">Drag to orbit · Scroll to zoom · Click a planet to focus</p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../roadtrip2/webgl/vendor/three.module.min.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
